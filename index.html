<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Noto+Serif+Bengali:wght@500;600&family=Noto+Sans+Bengali:wght@400;500;600&display=swap">
<title>Alfaaz-e-Hayat Studio</title>
<style>
:root { --bg:#f3eee4; --surface:#fffdf8; --ink:#241c14; --muted:#6d6256; --primary:#1d5c42; --soft:#e7f2eb; --gold:#8a6232; --goldsoft:#f6edd9; --line:#e4d8c8; --danger:#8a3d32; --sheet:#f7f3eb; }
html.dark { --bg:#121614; --surface:#1c2420; --ink:#f6f1e8; --muted:#c4bbae; --primary:#9ed9bc; --soft:#243028; --gold:#e4c98a; --goldsoft:#2c2618; --line:#314038; --danger:#f0b2a8; --sheet:#121614; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin:0; min-height:100dvh; display:flex; flex-direction:column; font-family:"Noto Sans Bengali", "Segoe UI", sans-serif; font-size:16.5px; background:var(--bg); color:var(--ink); line-height:1.65; }
button, a, input, textarea, select { font: inherit; }
header { order:0; position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:12px; padding:max(12px, env(safe-area-inset-top)) 16px 12px; background:color-mix(in srgb, var(--bg) 92%, transparent); border-bottom:1px solid var(--line); backdrop-filter:blur(10px); }
header img { width:40px; height:40px; border-radius:12px; object-fit:contain; background:#f4efe6; border:1px solid var(--line); flex:0 0 auto; }
.brand { min-width:0; }
h1 { margin:0; font-family:"Cormorant Garamond", "Times New Roman", serif; font-weight:600; font-style:italic; font-size:clamp(1.28rem, 4.4vw, 1.6rem); letter-spacing:.01em; color:var(--primary); line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
h2, h3, .gold, .go, nav button { font-family:"Noto Serif Bengali", "Cormorant Garamond", serif; }
h2 { font-size:clamp(1.35rem, 4.8vw, 1.6rem); font-weight:600; margin:0 0 6px; line-height:1.35; overflow-wrap:anywhere; }
h3 { font-size:1.12rem; font-weight:600; margin:16px 0 6px; line-height:1.35; }
.sub { margin:2px 0 0; color:var(--muted); font-size:.75rem; line-height:1.3; }
.clock { margin-left:auto; text-align:right; line-height:1.05; flex:0 0 auto; }
.clock time { display:block; font-family:"Cormorant Garamond", serif; font-weight:600; font-size:1.2rem; color:var(--primary); font-variant-numeric:tabular-nums; }
.clock span { display:block; margin-top:2px; color:var(--muted); font-size:.68rem; letter-spacing:.02em; }
.side { position:relative; flex:0 0 auto; }
.more { width:36px; height:36px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink); letter-spacing:.18em; font-size:.9rem; }
.pop { position:absolute; right:0; top:calc(100% + 8px); width:168px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:8px; box-shadow:0 18px 40px rgba(36,28,20,.16); z-index:8; }
.pop .langs { display:grid; grid-template-columns:1fr 1fr; gap:4px; }
.pop button { display:block; width:100%; min-height:40px; border:0; border-radius:10px; background:transparent; color:var(--ink); text-align:left; padding:0 10px; font-size:.95rem; }
.langs button { text-align:center; background:var(--bg); font-family:"Noto Serif Bengali", serif; }
.langs button.on { background:var(--primary); color:#fffdf8; }
.pop button.on { background:var(--goldsoft); color:var(--gold); }
main { order:1; width:min(680px, 100%); margin:0 auto; padding:20px 16px calc(96px + env(safe-area-inset-bottom)); }
.banner { width:100%; height:132px; object-fit:cover; border-radius:18px; display:block; margin-bottom:16px; }
.muted { color:var(--muted); }
.card, .pick, .field, .row { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px 16px; margin-top:10px; }
.pick, .go { border:0; width:100%; min-height:54px; border-radius:16px; text-align:left; padding:10px 16px; }
.pick.on, .go { background:var(--primary); color:#fffdf8; }
.pick { background:var(--surface); color:var(--ink); border:1px solid var(--line); }
.go:disabled { opacity:.45; }
label { display:block; color:var(--muted); font-size:.92rem; margin-top:12px; }
textarea, input, select { width:100%; margin-top:6px; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:14px; padding:12px 14px; font-size:16px; line-height:1.65; }
textarea { min-height:160px; }
.gold { color:var(--gold); font-size:.86rem; }
.soft { background:var(--soft); color:var(--primary); border-radius:18px; padding:16px; margin-top:12px; }
.warn { background:var(--goldsoft); border-radius:14px; padding:12px 14px; margin-top:8px; }
.danger { color:var(--danger); }
.copy { border:0; background:var(--soft); color:var(--primary); min-height:40px; border-radius:999px; padding:0 14px; margin-top:8px; }
nav { order:2; position:fixed; left:0; right:0; bottom:0; display:grid; grid-template-columns:repeat(4,1fr); background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
nav button { border:0; background:transparent; min-height:54px; color:var(--muted); font-size:.92rem; }
nav button.on { color:var(--primary); }
ol { padding:0; list-style:none; }
textarea.field, .field textarea { min-height:72px; }
.tick { display:flex; align-items:center; gap:10px; width:100%; min-height:48px; border:0; background:transparent; color:inherit; text-align:left; }
.box { width:22px; height:22px; border:1px solid var(--line); border-radius:6px; display:grid; place-items:center; flex:0 0 auto; }
.box.on { background:var(--primary); color:#fffdf8; }
@media (min-width: 900px) {
  body { background:#e7dfd2; }
  html.dark body { background:#0c100e; }
  header { width:min(760px, calc(100% - 48px)); margin:12px auto 0; border:1px solid var(--line); border-radius:20px; background:var(--surface); }
  nav { position:static; width:min(760px, calc(100% - 48px)); margin:10px auto 0; border:1px solid var(--line); border-radius:16px; overflow:hidden; background:var(--surface); order:0; }
  main { width:min(760px, calc(100% - 48px)); margin:12px auto 28px; padding:28px 32px 40px; background:var(--bg); border:1px solid var(--line); border-radius:24px; }
}
@media (max-width: 380px) {
  h1 { font-size:1.2rem; }
  .clock time { font-size:1.05rem; }
  header { gap:8px; padding-left:12px; padding-right:12px; }
}
</style>
</head>

  document.querySelectorAll("nav button").forEach(function (btn) { btn.textContent = c[btn.dataset.v]; btn.classList.toggle("on", state.view === btn.dataset.v); });
  const app = $("app");
  if (state.view === "make" && state.step === "pick") {
    app.innerHTML = '<img class="banner" alt="Alfaaz-e-Hayat" src="'+ $("banner").src +'"><p class="gold">1</p><h2>'+escapeHtml(c.where)+'</h2><p class="muted">'+escapeHtml(c.hint)+'</p>' + placeButtons() + '<button class="go" id="toScript" style="margin-top:12px"'+(state.picked.length?"":" disabled")+'>'+escapeHtml(c.next)+'</button>';
  } else if (state.view === "make" && state.step === "write") {
    app.innerHTML = '<button class="copy" id="backPick">'+escapeHtml(c.back)+'</button><h2>'+escapeHtml(c.story)+'</h2><p class="muted">'+escapeHtml(c.storyHint)+'</p><textarea id="script"></textarea><div id="live"></div><button class="go" id="build" style="margin-top:12px">'+escapeHtml(c.build)+'</button>';
    $("script").value = state.script;
    $("live").innerHTML = scan(state.script).map(function (line) { return '<div class="warn">'+escapeHtml(line)+'</div>'; }).join("");
  } else if (state.view === "make" && state.pack) {
    const rows = state.pack.fields.map(function (field, i) {
      return '<div class="field"><p class="gold">'+escapeHtml(field.label)+'</p><textarea data-field="'+i+'">'+escapeHtml(field.value)+'</textarea><button class="copy" data-copy="'+i+'">'+escapeHtml(c.copy)+'</button></div>';
    }).join("");
    const times = ["asia","europe","america"].map(function (id) {
      return '<button class="pick'+(state.slot===id?" on":"")+'" data-slot="'+id+'">'+escapeHtml(zoneClock(ZONES[id][0], ZONES[id][1])+" · "+c[id])+'</button>';
    }).join("");
    const ticks = c.ticks.map(function (label, i) {
      const on = state.ticks.indexOf(String(i)) >= 0;
      return '<button class="tick" data-tick="'+i+'"><span class="box'+(on?" on":"")+'">'+(on?"✓":"")+'</span>'+escapeHtml(label)+'</button>';
    }).join("");
    const ready = state.slot && c.ticks.every(function (_, i) { return state.ticks.indexOf(String(i)) >= 0; });
    app.innerHTML = '<button class="copy" id="backWrite">'+escapeHtml(c.back)+'</button><h2>'+escapeHtml(state.pack.title)+'</h2><button class="go" id="copyAll" style="margin-top:12px">'+escapeHtml(c.copyAll)+'</button><p id="copied" class="muted"></p>' + rows + '<h3>'+escapeHtml(c.when)+'</h3>' + times + '<div class="warn"><strong>'+escapeHtml(c.before)+'</strong>'+ticks+'<button class="go" id="mark" style="margin-top:12px"'+(ready?"":" disabled")+'>'+escapeHtml(ready?c.posted:c.need)+'</button></div>';
  } else if (state.view === "today") {
    const k = dayKey(new Date());
    const follow = [];
    state.uploads.slice(0, 8).forEach(function (u) {
      const age = Date.now() - new Date(u.at).getTime();
      if (!u.replied && age < 12*60*60*1000) follow.push('<button class="pick" data-reply="'+u.id+'">'+escapeHtml(c.reply+u.title)+'</button>');
      if (u.views == null && age > 20*60*60*1000) follow.push('<button class="pick" data-go="book">'+escapeHtml(c.logv+u.title)+'</button>');
      if (age > 3*24*60*60*1000) follow.push('<button class="pick" data-open="'+u.id+'">'+escapeHtml(c.day3+u.title)+'</button>');
      if (isWeak(u)) follow.push('<button class="pick" data-open="'+u.id+'">'+escapeHtml(c.weak)+'</button>');
    });
    const tasks = [
      [k+":make", todayCount()?c.taskMade:c.taskMake],
      [k+":reply", c.taskReply],
      [k+":views", c.taskViews]
    ].map(function (task) {
      const on = !!state.dayChecks[task[0]];
      return '<button class="tick" data-day="'+task[0]+'"><span class="box'+(on?" on":"")+'">'+(on?"✓":"")+'</span>'+escapeHtml(task[1])+'</button>';
    }).join("");
    app.innerHTML = '<div class="soft"><p>'+escapeHtml(c.today+" · "+c.week+" "+weekCount()+"/7")+'</p><h2>'+escapeHtml(todayCount()?c.done:c.one)+'</h2><p>'+escapeHtml(c.f2+" "+c.f24+" "+c.f3)+'</p></div><div class="card"><strong>'+escapeHtml(c.follow)+'</strong><p>'+escapeHtml(c.f2)+'</p><p>'+escapeHtml(c.f24)+'</p><p>'+escapeHtml(c.f3)+'</p>'+(follow.join("") || '<p class="muted">'+escapeHtml(c.emptyFollow)+'</p>')+'</div><div class="card"><strong>'+escapeHtml(c.when)+'</strong><p>'+escapeHtml(zoneClock(ZONES.asia[0], ZONES.asia[1])+" · "+c.asia)+'</p><p>'+escapeHtml(zoneClock(ZONES.europe[0], ZONES.europe[1])+" · "+c.europe)+'</p><p>'+escapeHtml(zoneClock(ZONES.america[0], ZONES.america[1])+" · "+c.america)+'</p></div><div class="card"><strong>'+escapeHtml(c.list)+'</strong>'+tasks+'</div>';
  } else if (state.view === "tips") {
    app.innerHTML = '<h2>'+escapeHtml(c.tips)+'</h2><p class="muted">'+escapeHtml(c.tipsLead)+'</p>' + tips().map(function (line) { return '<div class="card">'+escapeHtml(line)+'</div>'; }).join("");
  } else if (state.view === "guide") {
    app.innerHTML = '<img class="banner" alt="" src="'+$("banner").src+'"><h2>'+escapeHtml(c.guide)+'</h2><p>'+escapeHtml(c.lead)+'</p><ol>'+c.steps.map(function (line,i) { return '<li class="card">'+(i+1)+'. '+escapeHtml(line)+'</li>'; }).join("")+'</ol>';
  } else if (state.view === "review") {
    const opts = state.uploads.map(function (u) { return '<option value="'+escapeHtml(u.id)+'"'+(state.note.id===u.id?" selected":"")+'>'+escapeHtml(u.title)+'</option>'; }).join("");
    app.innerHTML = '<h2>'+escapeHtml(c.reviewTitle)+'</h2><p class="muted">'+escapeHtml(c.reviewHint)+'</p>' + (opts?'<select id="pickVideo"><option value=""></option>'+opts+'</select>':"") + '<label>'+escapeHtml(c.name)+'</label><input id="rTitle" value="'+escapeHtml(state.note.title)+'"><label>'+escapeHtml(c.views)+'</label><input id="rViews" inputmode="numeric" value="'+escapeHtml(state.note.views)+'"><label>'+escapeHtml(c.what)+'</label><textarea id="rNote">'+escapeHtml(state.note.text)+'</textarea><button class="go" id="solve" style="margin-top:12px">'+escapeHtml(c.solve)+'</button>' + (state.note.lines||[]).map(function (line) { return '<div class="card">'+escapeHtml(line)+'</div>'; }).join("");
  } else {
    const rows = state.uploads.length ? state.uploads.map(function (u) {
      const when = new Date(u.at).toLocaleString(undefined, { day:"numeric", month:"short", hour:"numeric", minute:"2-digit" });
      return '<div class="card"><strong>'+escapeHtml(u.title)+'</strong><p class="muted">'+escapeHtml(when+" · "+(u.views==null?c.views:u.views+" "+c.views)+(u.replied?" · "+c.replied:""))+'</p><input data-id="'+u.id+'" inputmode="numeric" placeholder="'+escapeHtml(c.views)+'" value="'+(u.views==null?"":escapeHtml(u.views))+'"><button class="copy" data-save="'+u.id+'">'+escapeHtml(c.save)+'</button><button class="copy" data-open="'+u.id+'">'+escapeHtml(c.review)+'</button></div>';
    }).join("") : '<p class="muted">'+escapeHtml(c.empty)+'</p>';
    app.innerHTML = '<h2>'+escapeHtml(c.book)+'</h2>' + rows;
  }
  save();
}
function toast(msg) {
  const node = $("copied");
  if (node) node.textContent = msg;
}
document.body.addEventListener("click", function (event) {
  const pop = $("pop");
  if (pop && !pop.hidden && !event.target.closest("#pop") && !event.target.closest("#moreBtn")) pop.hidden = true;
  const el = event.target.closest("button, a");
  if (!el) return;
  if (el.dataset.v) { state.view = el.dataset.v; render(); return; }
  if (el.dataset.p) {
    state.picked = state.picked.includes(el.dataset.p) ? state.picked.filter(function (x) { return x !== el.dataset.p; }) : state.picked.concat(el.dataset.p);
    render(); return;
  }
  if (el.dataset.slot) { state.slot = el.dataset.slot; render(); return; }
  if (el.dataset.tick != null) {
    const id = el.dataset.tick;
    state.ticks = state.ticks.indexOf(id) >= 0 ? state.ticks.filter(function (x) { return x !== id; }) : state.ticks.concat(id);
    render(); return;
  }
  if (el.dataset.day) { state.dayChecks[el.dataset.day] = !state.dayChecks[el.dataset.day]; render(); return; }
  if (el.dataset.reply) {
    const item = state.uploads.find(function (u) { return u.id === el.dataset.reply; });
    if (item) item.replied = true;
    render(); return;
  }
  if (el.dataset.go) { state.view = el.dataset.go; render(); return; }
  if (el.dataset.open) {
    const item = state.uploads.find(function (u) { return u.id === el.dataset.open; });
    state.view = "review";
    if (item) { state.note.id = item.id; state.note.title = item.title; state.note.views = item.views == null ? "" : String(item.views); }
    render(); return;
  }
  if (el.id === "toScript") { if (!state.picked.length) return; state.step = "write"; state.view = "make"; render(); return; }
  if (el.id === "backPick") { state.step = "pick"; render(); return; }
  if (el.id === "backWrite") { state.step = "write"; render(); return; }
  if (el.id === "build") {
    state.script = $("script").value;
    if (state.script.trim().length < 20) return;
    state.pack = packOf(state.script, state.picked);
    state.step = "pack"; state.slot = ""; state.ticks = [];
    render(); return;
  }
  if (el.id === "copyAll" && state.pack) {
    const text = state.pack.fields.map(function (f) { return f.label + "\n" + f.value; }).join("\n\n");
    navigator.clipboard.writeText(text).then(function () { toast(t().copied); }).catch(function () { toast(text); });
    return;
  }
  if (el.dataset.copy != null && state.pack) {
    const value = state.pack.fields[Number(el.dataset.copy)].value;
    navigator.clipboard.writeText(value).then(function () { toast(t().copied); }).catch(function () {});
    return;
  }
  if (el.id === "mark" && state.slot && state.pack) {
    state.uploads.unshift({ id: String(Date.now()), title: state.pack.title, at: new Date().toISOString(), views: null, slot: state.slot, language: state.pack.language, replied: false });
    state.uploads = state.uploads.slice(0, 120);
    state.step = "pick"; state.script = ""; state.slot = ""; state.pack = null; state.ticks = []; state.view = "today";
    render(); return;
  }
  if (el.dataset.save) {
    const input = document.querySelector('input[data-id="'+el.dataset.save+'"]');
    const item = state.uploads.find(function (u) { return u.id === el.dataset.save; });
    if (item && input && input.value !== "" && !Number.isNaN(Number(input.value))) { item.views = Number(input.value); render(); }
    return;
  }
  if (el.id === "solve") {
    state.note.title = $("rTitle").value;
    state.note.views = $("rViews").value;
    state.note.text = $("rNote").value;
    state.note.lines = diagnose();
    render(); return;
  }
  if (el.id === "moreBtn") { $("pop").hidden = !$("pop").hidden; return; }
  if (el.id === "bn" || el.id === "en") { state.lang = el.id; $("pop").hidden = true; render(); return; }
  if (el.id === "theme") { state.dark = !state.dark; render(); return; }
  if (el.id === "eGuide") { state.view = state.view === "guide" ? "make" : "guide"; $("pop").hidden = true; render(); return; }
  if (el.id === "eTips") { state.view = state.view === "tips" ? "make" : "tips"; $("pop").hidden = true; render(); return; }
});
document.body.addEventListener("change", function (event) {
  if (event.target.id !== "pickVideo") return;
  const item = state.uploads.find(function (u) { return u.id === event.target.value; });
  if (!item) return;
  state.note.id = item.id;
  state.note.title = item.title;
  state.note.views = item.views == null ? "" : String(item.views);
  render();
});
document.body.addEventListener("input", function (event) {
  const node = event.target;
  if (node.id === "script") {
    state.script = node.value;
    const live = $("live");
    if (live) live.innerHTML = scan(state.script).map(function (line) { return '<div class="warn">'+escapeHtml(line)+'</div>'; }).join("");
    save();
  }
  if (node.dataset && node.dataset.field != null && state.pack) {
    const field = state.pack.fields[Number(node.dataset.field)];
    field.value = node.value;
    if (field.key === "title") state.pack.title = node.value;
    save();
  }
});
render();
setInterval(paintClock, 1000);
</script>
</body>
